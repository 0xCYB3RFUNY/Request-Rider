# Overlay для РАБОЧЕГО docker-стенда (`docker-compose.yml`), а не для тестового.
#
#   docker compose -p requestrider -f docker-compose.yml -f docker-stand.overlay.yml up -d
#
# Тестовый стенд (`docker-compose.test.yml`, проект `rr_test`) этот файл не
# читает: у него своя топология и свои порты.
#
# Файл существует по трём причинам, и каждая проверена в коде, а не взята из
# предположений: сам по себе `docker-compose.yml` стенд не поднимает.
#
# ──────────────────────────── Порты хоста ────────────────────────────────
#
# Родные порты compose-файла (8000, 8080, 8081, 8090, 5432, 9050) совпадают с
# портами нативного стенда `start.sh`, а оба живут на одной машине: пока
# поднят нативный стенд, docker-стенд не может занять ни один из них. Свой
# диапазон снимает это требование — теперь стенды сосуществуют, и переключать
# их не нужно.
#
# Диапазон 28xxx/29xxx выбран отдельно от тестового compose (18xxx/15xxx/16xxx),
# поэтому рабочий и тестовый стенды могут стоять одновременно.
#
# Тег `!override` обязателен и не косметика. Измерено на compose 2.40.3: без
# тега список `ports` в overlay СКЛАДЫВАЕТСЯ со списком базового файла, и
# публикуются оба — `127.0.0.1:8000:8000` и `127.0.0.1:28000:8000`, то есть
# один и тот же контейнерный порт дважды, и демон отвечает «port is already
# allocated». С `!override` остаётся ровно одна публикация.
#
# Каждый порт переопределяется переменной. В `${VAR:-28000}` именно `:-`
# даёт дефолт и при пустом значении тоже, поэтому `RR_WEB_PORT=` в окружении
# не ломает стенд, а возвращает дефолт.

services:
  # Движок: 1) разрешение bind'а на 0.0.0.0, 2) ключ сервисного обмена.
  #
  # `engine/main.go:634,642` вызывают `requireLoopbackBind()`, который на
  # не-loopback адресе делает `log.Fatalf`, если не выставлен
  # `RR_ALLOW_NON_LOOPBACK_BIND=1`. Compose задаёт
  # `PROXY_LISTEN_ADDR=0.0.0.0:8080` и `ENGINE_LISTEN_ADDR=0.0.0.0:8081` —
  # контейнер движка умирал на старте, не успев ответить /health.
  #
  # Флаг существует ровно для этого случая: внутри контейнера 0.0.0.0 —
  # обязательное условие доставки трафика Docker-сетью, а не «случайно
  # открытый интерфейс». Наружу порты публикуются только на 127.0.0.1.
  engine:
    environment:
      RR_ALLOW_NON_LOOPBACK_BIND: "1"
      # Маршрут двигается между контейнерами, поэтому он задаётся здесь, а
      # `${VAR-default}` — именно без двоеточия: `:-` вернул бы значение по
      # умолчанию и на ПУСТОЙ переменной, а пустая строка здесь значит «Direct»
      # (так это трактует README и сам движок). С `:-` переключить режим было
      # бы нечем — `./docker-stand.sh direct on` экспортирует пустое значение,
      # и двигатель стартует напрямую, без Tor.
      ROUTE_ADDRESS: ${RR_ROUTE_ADDRESS-tor:9050}
    ports: !override
      - "127.0.0.1:${RR_PROXY_PORT:-28080}:8080"
      - "127.0.0.1:${RR_ENGINE_PORT:-28081}:8081"

  # Сервисного ключа (`RR_INTERNAL_API_KEY`) тут більше немає — він видалений
  # наскрізь. Замість нього лишається перевірка `Host` на loopback, яку робить
  # і движок, і browser-worker: вона закриває DNS rebinding і не залежить від
  # того, звідки запущено процес.
  #
  # Флаг bind'а здесь — по той же причине, что у движка, и намертво забытый
  # в четвёртый раз: `browser-worker/worker.py:2182` проверяет его точно так же
  # и печатает «refuses to bind 0.0.0.0», а базовый compose выставляет воркеру
  # `HOST: 0.0.0.0` с собственным комментарием о том, что без этого не работает.
  # Измерено: без флага контейнер уходил в перезапуск, 12 рестартов и
  # `exit=1`, а compose показывал его как поднятый.
  browser-worker:
    environment:
      RR_ALLOW_NON_LOOPBACK_BIND: "1"
    ports: !override
      - "127.0.0.1:${RR_WORKER_PORT:-28090}:8090"

  web:
    environment:
      # Django пишет сгенерированный SECRET_KEY в `data/run/secret_key` — то
      # есть в путь ВНУТРИ образа. Тома туда не смонтированы, поэтому каждый
      # новый контейнер получал новый ключ, и все открытые сессии и CSRF-куки
      # становились невалидными после пересоздания. `web/.dockerignore` выбрасывает
      # `data/` и `.env*` из образа намеренно, поэтому секрет приходит из
      # `data/run/compose.env` — файла, который репозиторию не принадлежит.
      RR_SECRET_KEY: ${RR_SECRET_KEY:-}
    ports: !override
      - "127.0.0.1:${RR_WEB_PORT:-28000}:8000"

  celery:
    environment:

  engine-results:
    environment:

  postgres:
    ports: !override
      - "127.0.0.1:${RR_PG_PORT:-25432}:5432"

  tor:
    ports: !override
      - "127.0.0.1:${RR_TOR_PORT:-29050}:9050"
    # torrc монтируется, а не запекается в образ. Причина измерена: на этой
    # машине TLS к ретрансляторам рвётся на рукопожатии, и Tor выходит из строя
    # только через obfs4 — то есть через адреса мостов. Мосты меняются, они
    # выдаются под конкретную сеть и по CAPTCHA, и в репозитории им не место.
    # Файл генерирует `docker-stand.sh` из `data/run/tor.bridges`, поэтому
    # добавление моста — это правка одного файла и пересоздание контейнера, а не
    # пересборка образа.
    volumes:
      - ./data/run/torrc:/etc/tor/torrc:ro
