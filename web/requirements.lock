# Pinned dependency record for web/ — generated from the running venv, not hand-written.
# Regenerate after any deliberate upgrade, on the same interpreter family:
#   web/.venv/bin/pip freeze | grep -viE '^(pip|setuptools|wheel|pkg-resources|distribute)==' > web/requirements.lock
# requirements.txt stays the human-maintained input (ranges); this file is what fresh
# installs resolve to, so two checkouts install the same tree. Hashes (--require-hashes)
# are a follow-up: generating them needs the full wheel set from PyPI.

