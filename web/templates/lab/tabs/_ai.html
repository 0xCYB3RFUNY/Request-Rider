  <section id="ai" class="tab">
    <div id="workspace-tabs-ai" class="workspace-tabs" aria-label="AI workspaces" data-i18n-aria-label="a11y.workspacesAi"><div class="tool-corner-actions"><button type="button" class="tab-faq-trigger icon-btn" data-tab="ai" title="Довідка / FAQ" aria-label="FAQ & Manual">❓ <span data-i18n="faq.button">FAQ</span></button><button type="button" class="tab-settings-trigger icon-btn" data-tab="ai" title="Налаштування AI" aria-label="Налаштування AI">⚙️</button></div></div>
    <div class="ai-main-container">
      <!-- AI Sidebar -->
      <aside class="ai-sidebar" id="ai-sidebar">
        <div class="ai-sidebar-header">
          <div class="ai-sidebar-title">
            <svg viewBox="0 0 24 24" class="ai-icon-sm" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2a10 10 0 1 0 10 10H12V2z"></path><path d="M12 2a10 10 0 0 1 10 10"></path><circle cx="12" cy="12" r="3"></circle></svg>
            <span>AI SecOps</span>
          </div>
          <button type="button" class="ai-icon-btn" id="ai-clear-chat" title="Clear chat" data-i18n-title="ai.clear">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>

        <div class="ai-sidebar-section">
          <div class="ai-sidebar-section-title" data-i18n="ai.quickPresets">Quick audit presets</div>
          <div class="ai-presets-list">
            <button type="button" class="ai-preset-card" data-preset="vuln_analysis">
              <span class="ai-preset-icon">🛡️</span>
              <div class="ai-preset-info">
                <strong data-i18n="ai.presetVulnTitle">Vulnerability analysis</strong>
                <small data-i18n="ai.presetVulnDesc">Scan OWASP Top-10 & BOLA/IDOR</small>
              </div>
            </button>
            <button type="button" class="ai-preset-card" data-preset="headers_check">
              <span class="ai-preset-icon">🔒</span>
              <div class="ai-preset-info">
                <strong data-i18n="ai.presetHeadersTitle">Security Headers & CSP</strong>
                <small data-i18n="ai.presetHeadersDesc">Audit headers and cookies</small>
              </div>
            </button>
            <button type="button" class="ai-preset-card" data-preset="poc_generator">
              <span class="ai-preset-icon">⚡</span>
              <div class="ai-preset-info">
                <strong data-i18n="ai.presetPocTitle">PoC exploit generation</strong>
                <small data-i18n="ai.presetPocDesc">Generate test payload</small>
              </div>
            </button>
            <button type="button" class="ai-preset-card" data-preset="report_summary">
              <span class="ai-preset-icon">📝</span>
              <div class="ai-preset-info">
                <strong data-i18n="ai.presetReportTitle">Security report</strong>
                <small data-i18n="ai.presetReportDesc">Findings summary and remediation</small>
              </div>
            </button>
          </div>
        </div>

        <div class="ai-sidebar-section ai-sidebar-attached-section">
          <div id="agent-attached-evidence" class="agent-attached" aria-live="polite"></div>
        </div>
      </aside>

      <!-- AI Main Chat Pane -->
      <div class="ai-chat-pane" role="region" aria-label="AI Chat">
        <!-- Compact Clean Header Bar -->
        <header class="ai-chat-header">
          <div class="ai-model-selector-bar">
            <div class="ai-status-indicator" id="ai-status-indicator" title="LLM Ready">
              <span class="ai-status-dot"></span>
              <span class="ai-status-text" id="ai-status-label">Ready</span>
            </div>
            <div class="ai-provider-pill">
              <label for="agent-provider" class="sr-only" data-i18n="ai.provider">Provider</label>
              <select id="agent-provider">
                <option value="ollama" data-i18n="ai.providerOllama">Ollama (local)</option>
                <option value="openai">OpenAI</option>
                <option value="anthropic">Anthropic Claude</option>
                <option value="openrouter">OpenRouter</option>
                <option value="gemini" selected>Google Gemini</option>
                <option value="groq">Groq</option>
                <option value="mistral">Mistral</option>
                <option value="openai_compatible" data-i18n="ai.providerCustom">Custom OpenAI-compatible</option>
              </select>
            </div>
            <button type="button" class="ai-model-badge" id="ai-current-model-badge" title="Model & tool profile settings" data-i18n-title="ai.currentModelTooltip">
              gemini-flash-lite-latest
            </button>
          </div>

          <div class="ai-mode-pills" role="toolbar" aria-label="Agent mode toggles">
            <label class="ai-pill-toggle" title="Autonomous investigation with tool execution (ReAct Loop)" data-i18n-title="ai.reactAgentTooltip">
              <input id="agent-react-autonomous-mode" type="checkbox" checked>
              <span class="ai-pill-text" data-i18n="ai.reactAgentShort">⚡ ReAct</span>
            </label>

            <label class="ai-pill-toggle" title="Include active Project context" data-i18n-title="ai.useProjectContext">
              <input id="agent-use-project-context" type="checkbox">
              <span class="ai-pill-text" data-i18n="ai.projectContextShort">📁 Project</span>
            </label>
            <span id="agent-project-context-hint" class="muted ai-ctx-hint" aria-live="polite" style="display:none"></span>

            <label class="ai-pill-toggle" title="Allow the agent to open and drive a browser" data-i18n-title="ai.browserToolsTooltip">
              <input type="checkbox" id="agent-browser-allow" class="agent-browser-allow" aria-label="Browser tools" data-i18n-aria-label="ai.browserToolsLabel">
              <span class="ai-pill-text" data-i18n="ai.browserToolsShort">🌐 Browser</span>
            </label>

            <label class="ai-pill-toggle" id="agent-swarm-toggle-label" title="Run parallel specialist workers over a shared intent board" data-i18n-title="ai.swarmModeTooltip">
              <input id="agent-swarm-mode" type="checkbox">
              <span class="ai-pill-text" data-i18n="ai.swarmModeShort">👥 Swarm</span>
            </label>
          </div>

          <div class="ai-header-actions">
            <div class="export-menu" data-export-menu="ai">
              <button type="button" id="ai-export-btn" class="export-export-trigger ai-header-btn" aria-haspopup="menu" aria-expanded="false" title="Export audit results and dialogue" data-i18n-title="ai.exportTooltip">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="7 10 12 15 17 10"></polyline><line x1="12" y1="15" x2="12" y2="3"></line></svg>
                <span data-i18n="ai.exportLabel">Export</span>
                <svg class="export-caret" viewBox="0 0 10 6" aria-hidden="true" focusable="false"><path d="M1 1l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <div class="export-menu-list" role="menu" hidden>
                <button type="button" role="menuitem" data-format="html">
                  <b data-i18n="ai.exportHtmlTitle">HTML Report</b>
                  <span data-i18n="ai.exportHtmlDesc">Interactive audit report</span>
                </button>
                <button type="button" role="menuitem" data-format="json">
                  <b data-i18n="ai.exportJsonTitle">JSON Export</b>
                  <span data-i18n="ai.exportJsonDesc">Dialogue and ReAct steps</span>
                </button>
                <button type="button" role="menuitem" data-format="xml">
                  <b>XML Export</b>
                  <span>Dialogue and ReAct steps in XML</span>
                </button>
              </div>
            </div>

            <button type="button" class="ai-header-btn" id="ai-send-automation" data-i18n-title="button.sendAutomation">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
              <span data-i18n="ai.sendToAutomation">Automation</span>
            </button>

            <button type="button" class="ai-header-btn" id="ai-open-settings" title="Model settings" data-i18n-title="ai.settingsTooltip">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
              <span data-i18n="ai.settingsLabel">Settings</span>
            </button>

            <button type="button" class="ai-header-btn ai-fullscreen-trigger" id="ai-fullscreen-btn" title="Fullscreen reading mode" aria-label="Fullscreen reading mode" data-i18n-title="ai.fullscreenOpen" data-i18n-aria-label="ai.fullscreenOpen">
              <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"></path></svg>
              <span data-i18n="ai.fullscreenOpen">Fullscreen</span>
            </button>
          </div>
        </header>

        <!-- Compact Swarm Drawer: collapsed by default, expands only when Swarm mode is active -->
        <div class="ai-continuity-controls" id="ai-continuity-controls" style="display:none">
          <span class="ai-swarm-title" data-i18n="ai.swarmMode">👥 Parallel specialists:</span>
          <label class="ai-ctx-label" for="agent-swarm-workers" data-i18n="ai.swarmWorkers">Workers:</label>
          <input id="agent-swarm-workers" type="number" min="1" max="10" step="1" value="3" aria-label="Workers">
          <input id="agent-swarm-intents" type="text" data-i18n-placeholder="ai.swarmIntents" placeholder="Intents separated by |" aria-label="Intents">
          <button type="button" class="ai-header-btn" id="agent-continuity-status-btn" data-i18n="ai.continuityRefresh">Memory status</button>
          <span id="agent-continuity-status" class="muted ai-ctx-hint" role="status" aria-live="polite"></span>
        </div>

        <!-- Messages Log -->
        <div id="agent-chat-log" class="agent-chat-log" aria-live="polite">
          <div class="agent-empty" data-i18n="agent.startConversation">Start a QA conversation.</div>
        </div>

        <!-- Modern Claude/ChatGPT Style Input Bar -->
        <div class="ai-chat-input-container">
          <!-- Quick action chips -->
          <div class="ai-quick-chips">
            <button type="button" class="ai-chip" data-preset-chip="sqli" data-i18n="ai.chipSqliLabel">💉 Test SQLi & IDOR</button>
            <button type="button" class="ai-chip" data-preset-chip="cookies" data-i18n="ai.chipCookiesLabel">🍪 Check Cookies & Auth</button>
            <button type="button" class="ai-chip" data-preset-chip="poc" data-i18n="ai.chipPocLabel">🎯 PoC for Repeater</button>
            <button type="button" class="ai-chip" data-preset-chip="summary" data-i18n="ai.chipSummaryLabel">📋 Report summary</button>
          </div>

          <div class="ai-input-box-wrapper" id="ai-input-box-wrapper">
            <div id="ai-attached-files-bar" class="ai-attached-files-bar" style="display:none"></div>
            <div class="ai-input-box-top-actions" id="ai-input-box-top-actions" style="display:none">
              <span class="ai-input-mode-badge">
                <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
                <span data-i18n="ai.expandedModeTitle">Розширений редактор промпта</span>
              </span>
              <button type="button" class="ai-collapse-top-btn" id="ai-collapse-top-btn" title="Згорнути поле (Esc)" aria-label="Згорнути поле (Esc)" data-i18n-title="ai.collapseTooltip" data-i18n-aria-label="ai.collapseTooltip">
                <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 14h6v6M20 10h-6V4M14 10l7-7M10 14l-7 7"/></svg>
                <span data-i18n="ai.collapseLabel">Згорнути (Esc)</span>
              </button>
            </div>
            <textarea id="agent-chat-input" rows="3" aria-label="Поле запиту до AI-асистента" placeholder="Ask a security question or attach crawler/scanner report (Ctrl+Enter to send)..." data-i18n-placeholder="ai.chatPlaceholder"></textarea>
            <div class="ai-input-box-footer">
              <div class="ai-input-left-tools">
                <button type="button" class="ai-attach-file-btn" id="ai-attach-file-btn" title="Attach report (HTML, JSON, HAR, TXT, CSV)" data-i18n-title="ai.attachReportTitle">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
                  <span data-i18n="ai.attachReportLabel">Attach report</span>
                </button>
                <button type="button" class="ai-attach-file-btn ai-expand-btn" id="ai-input-expand-btn" title="Розгорнути / згорнути поле вводу" aria-label="Toggle input size" data-i18n-title="ai.expandInput" data-i18n-aria-label="ai.expandInput">
                  <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" class="ai-expand-icon"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
                  <span class="ai-expand-text" data-i18n="ai.expandLabel">Розгорнути</span>
                </button>
                <input type="file" id="ai-file-input" accept=".json,.html,.htm,.txt,.log,.har,.xml,.csv,.md" multiple hidden>
                <div class="ai-input-hints">
                  <span class="ai-kbd-hint">Ctrl + Enter</span> <span data-i18n="ai.kbdSend">to send</span>
                </div>
              </div>
              <button type="button" class="ai-send-button" id="agent-chat-send" title="Send message" aria-label="Send message" data-i18n-title="button.sendChat" data-i18n-aria-label="button.sendChat">
                <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="22" y1="2" x2="11" y2="13"></line>
                  <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Hidden native inputs strictly hidden via inline style for safety -->
    <div style="display:none !important">
      <input id="agent-endpoint" type="url" value="https://generativelanguage.googleapis.com/v1beta/openai/chat/completions" data-i18n-placeholder="ai.endpoint">
      <input id="agent-model" value="gemini-flash-lite-latest" data-i18n-placeholder="ai.model">
      <input id="agent-api-key" type="password" value="" aria-label="API Key" autocomplete="off" data-i18n-placeholder="ai.apiKey">
      <input id="agent-tool-profile" value="auto" aria-label="Tool profile">
    </div>
  </section>
